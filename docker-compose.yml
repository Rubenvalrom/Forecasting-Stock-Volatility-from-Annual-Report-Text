# docker-compose.yml
services:
# Mlflow server
  mlflow:
    image: ghcr.io/mlflow/mlflow
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:////mlflow/mlflow.db --default-artifact-root /mlartifacts
    ports: ["5000:5000"]
    volumes: ["./mlruns:/mlflow", "./mlartifacts:/mlartifacts"]

  # Build pipeline from dockerfile  
  app:
    build: .
    env_file: .env
    environment: ["MLFLOW_TRACKING_URI=http://mlflow:5000"]
    volumes: ["./data:/app/data", "./mlartifacts:/mlartifacts"]
    depends_on: [mlflow]